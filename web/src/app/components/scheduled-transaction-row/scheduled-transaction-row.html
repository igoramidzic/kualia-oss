<a
  [class]="
    (isSelected() ? 'bg-primary/30 hover:bg-primary/40 ' : 'hover:bg-accent/30 ') +
    'group grid h-10 items-center overflow-hidden border-b py-0 pr-2 pl-0 sm:pr-3' +
    (isLast() ? ' !border-b-0' : '')
  "
  [style.grid-template-columns]="
    showBankAccountBadge() && showNotes()
      ? '2rem 2rem 7.5rem 1fr 1fr 1fr 1fr 5.5rem 1.5rem'
      : showBankAccountBadge()
        ? '2rem 2rem 7.5rem 1fr 1fr 1fr 5.5rem 1.5rem'
        : showNotes()
          ? '2rem 2rem 7.5rem 1fr 1fr 1fr 5.5rem 1.5rem'
          : '2rem 2rem 7.5rem 1fr 1fr 5.5rem 1.5rem'
  "
  [routerLink]="scheduledRoute()"
  tabindex="-1"
  hlmContextMenuTrigger
  [hlmContextMenuTrigger]="scheduledTransactionContextMenu"
>
  <!-- Column 1: Checkbox -->
  <label
    [for]="'scheduled-checkbox-' + scheduled()._id"
    class="flex h-full cursor-default items-center justify-center"
    tabindex="-1"
    (click)="$event.stopPropagation(); $event.preventDefault(); onCheckboxClick($event)"
    (keydown.enter)="$event.stopPropagation(); onCheckboxClick($event)"
    (keydown.space)="$event.stopPropagation(); onCheckboxClick($event); $event.preventDefault()"
  >
    <hlm-checkbox
      [id]="'scheduled-checkbox-' + scheduled()._id"
      [checked]="isSelected()"
      (click)="$event.stopPropagation(); onCheckboxClick($event)"
      [class]="
        isSelected()
          ? 'border-primary transition-none'
          : 'border-primary opacity-0 transition-none group-hover:opacity-100 focus-visible:opacity-100'
      "
    />
  </label>

  <!-- Column 2: Scheduled indicator -->
  <div class="flex h-full items-center justify-center">
    <nucleo-icon [icon]="CalendarClock" [size]="16" class="text-muted-foreground" [attr.title]="recurrenceText()" />
  </div>

  <!-- Column 3: Date (next occurrence) -->
  <div class="min-w-0">
    <app-transaction-date-picker
      [date]="displayDate()"
      [max]="null"
      [disabled]="isSavingDate()"
      variant="ghost"
      buttonClass="h-7 w-full min-w-0 justify-start overflow-hidden px-1 text-sm font-normal [&>span]:min-w-0 [&>span]:max-w-full [&_nucleo-icon]:hidden"
      (dateChange)="onDateChange($event)"
    />
  </div>

  <!-- Column 4: Payee -->
  <div class="flex min-w-0 items-center gap-0.5">
    <div class="relative flex-shrink-0">
      @if (isTransfer()) {
        <app-entity-mark
          [mode]="displayTransferToAccount()?.visualIdentityMode"
          [logoUrl]="displayTransferToAccount()?.resolvedLogoUrl"
          [iconName]="displayTransferToAccount()?.iconName ?? defaultBankAccountIconName"
          [iconColorId]="displayTransferToAccount()?.iconColorId"
          [defaultIconName]="defaultBankAccountIconName"
          [alt]="displayTransferToAccount()?.name ?? 'Transfer destination'"
          size="xs"
        />
      } @else {
        <app-entity-mark
          [mode]="displayMerchant()?.visualIdentityMode"
          [logoUrl]="displayMerchant()?.logoUrl"
          [iconName]="displayMerchant()?.iconName"
          [iconColorId]="displayMerchant()?.iconColorId"
          [defaultIconName]="defaultMerchantIconName"
          [alt]="displayMerchant()?.name ?? 'No payee'"
          size="xs"
        />
      }
    </div>
    <div class="min-w-0 flex-1">
      <app-payee-selector
        [merchantId]="displayMerchantId()"
        [selectedBankAccountId]="displayTransferToAccountId()"
        [pendingMerchantName]="displayPendingMerchantName()"
        [availableBankAccounts]="isTransfer() ? transferPayeeAccounts() : []"
        [transactionType]="isTransfer() ? 'transfer' : 'regular'"
        [transactionAmount]="isTransfer() ? -1 : 0"
        [disabled]="isSavingMerchant()"
        variant="ghost"
        buttonClass="h-7 w-full min-w-0 justify-start overflow-hidden px-1 text-sm font-normal [&>span]:min-w-0 [&>span]:max-w-full"
        [showIcon]="false"
        [allowNone]="false"
        (payeeChange)="onPayeeChange($event)"
      />
    </div>
  </div>

  <!-- Column 5: Bank Account (conditional) -->
  @if (showBankAccountBadge()) {
    <div class="flex min-w-0 items-center">
      <div class="min-w-0 flex-1">
        <app-bank-account-selector
          [bankAccountId]="displayBankAccountId()"
          [disabled]="isSavingBankAccount()"
          [allowNone]="false"
          [excludeAccountIds]="transferSourceExcludeIds()"
          variant="ghost"
          buttonClass="h-7 w-full min-w-0 justify-start overflow-hidden px-1 text-sm font-normal [&>span]:min-w-0 [&>span]:max-w-full"
          (bankAccountChange)="onBankAccountChange($event)"
        />
      </div>
    </div>
  }

  <!-- Column 6: Category (single) or split summary -->
  @if (isTransfer() && !hasTransferCategory()) {
    <div class="flex h-7 items-center px-1">
      <span class="bg-accent/50 max-w-full truncate rounded-md px-2 py-0.5 text-xs">Transfer</span>
    </div>
  } @else if (isSplit()) {
    <div class="flex h-7 items-center px-1">
      <span class="bg-accent/50 max-w-full truncate rounded-md px-2 py-0.5 text-xs">{{ splitCategoryLabel() }}</span>
    </div>
  } @else {
    <div class="min-w-0">
      <app-category-selector
        [categoryId]="displayCategoryId()"
        [isReadyToAssign]="displayReadyToAssign()"
        [disabled]="isSavingCategory()"
        [yearMonth]="displayYearMonth()"
        variant="ghost"
        buttonClass="h-7 w-full min-w-0 justify-start overflow-hidden px-1 text-sm font-normal [&>span]:min-w-0 [&>span]:max-w-full"
        [allowNone]="true"
        (categoryChange)="onCategoryChange($event)"
      />
    </div>
  }

  <!-- Column 7: Notes (hidden on medium or smaller screens) -->
  @if (showNotes()) {
    <div class="text-muted-foreground min-w-0 truncate px-1 text-sm">
      {{ scheduled().notes ?? '' }}
    </div>
  }

  <!-- Column 8: Amount (display only) -->
  <span class="text-right text-sm" [class.text-green-500]="isPositiveAmount()">
    {{ amountDisplay() }}
  </span>

  <!-- Column 9: Status Icon -->
  <div class="flex items-center justify-end">
    @if (isPending()) {
      <nucleo-icon [icon]="ClockFading" class="h-3.5 w-3.5 text-yellow-500" />
    }
  </div>
</a>

<!-- Context Menu Template -->
<ng-template #scheduledTransactionContextMenu>
  <hlm-dropdown-menu class="w-48">
    <button hlmDropdownMenuItem variant="destructive" [disabled]="isDeleting()" (click)="onContextMenuDelete()">
      <nucleo-icon [icon]="Trash2" [size]="14" />
      <span class="text-xs">Delete</span>
    </button>
  </hlm-dropdown-menu>
</ng-template>
