<header class="flex items-center justify-between px-6 py-4">
  <div class="relative">
    <button
      type="button"
      hlmBtn
      variant="ghost"
      size="sm"
      class="justify-start px-2 py-1.5 text-sm"
      hlmDropdownMenuTrigger
      [hlmDropdownMenuTrigger]="userMenu"
      aria-haspopup="menu"
    >
      <div class="flex items-center gap-2">
        <div class="bg-primary/10 text-primary flex h-7 w-7 items-center justify-center rounded-full text-xs">
          {{ userInitials() }}
        </div>
        <span class="text-sm font-light">{{ userEmail() }}</span>
        <nucleo-icon
          [icon]="ChevronDown"
          [size]="16"
          class="text-muted-foreground transition-transform duration-200"
        />
      </div>
    </button>

    <ng-template #userMenu>
      <hlm-dropdown-menu class="w-48">
        <button hlmDropdownMenuItem (click)="logout()">
          <span>Log Out</span>
        </button>
      </hlm-dropdown-menu>
    </ng-template>
  </div>
</header>
