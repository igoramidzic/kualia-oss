<div class="bg-background flex min-h-full items-center justify-center">
  <div class="w-full max-w-md space-y-8 px-4">
    <div class="text-center">
      <h1 class="text-3xl font-bold tracking-tight">Kualia</h1>
      <p class="text-muted-foreground mt-2 text-sm">Loading your financial workspace...</p>
    </div>

    <div class="flex justify-center">
      <nucleo-icon [icon]="LoaderCircle" class="text-primary h-8 w-8 animate-spin" />
    </div>

    @if (initializationError()) {
      <div class="rounded-lg border border-red-200 bg-red-50 p-4">
        <div class="flex items-start space-x-3">
          <nucleo-icon [icon]="AlertCircle" class="mt-0.5 text-red-600" size="20" />
          <div class="flex-1 space-y-2">
            <p class="text-sm font-medium text-red-900">Initialization Failed</p>
            <p class="text-sm text-red-700">{{ initializationError() }}</p>
          </div>
        </div>

        <div class="mt-4 flex justify-center">
          <button
            hlmBtn
            variant="outline"
            size="sm"
            [disabled]="isRetrying()"
            (click)="onRetryClick()"
            class="flex items-center space-x-2"
          >
            @if (isRetrying()) {
              <nucleo-icon [icon]="LoaderCircle" class="h-4 w-4 animate-spin" />
              <span>Retrying...</span>
            } @else {
              <nucleo-icon [icon]="RefreshCw" size="16" />
              <span>Retry</span>
            }
          </button>
        </div>
      </div>
    }
  </div>
</div>
