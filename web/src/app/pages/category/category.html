<ng-template #navTabs>
  <a routerLink="details" routerLinkActive="bg-accent/50" hlmBtn variant="ghost" size="sm" class="h-6 border text-xs">
    <nucleo-icon [icon]="SquareChartGantt" size="14" />
    Details
  </a>

  <a
    routerLink="transactions"
    routerLinkActive="bg-accent/50"
    hlmBtn
    variant="ghost"
    size="sm"
    class="h-6 border text-xs"
  >
    <nucleo-icon [icon]="ArrowLeftRight" size="14" />
    Transactions
  </a>
</ng-template>

<div class="flex h-full flex-col overflow-hidden">
  <div class="flex flex-shrink-0 flex-col border-b select-none">
    <div class="flex h-10 items-center px-3">
      <div class="flex min-w-0 flex-1 items-center gap-2">
        <app-sidebar-toggle class="lg:hidden" />
        <nav class="flex min-w-0 flex-1 items-center space-x-1 text-sm">
          <div class="flex items-center lg:hidden">
            @if (workspaceName()) {
              <a
                [routerLink]="linkToWorkspace()"
                class="text-muted-foreground hover:text-foreground m-0 flex items-center gap-1 p-1"
              >
                {{ workspaceName() }}
              </a>
              <nucleo-icon [icon]="ChevronRight" class="text-muted-foreground h-4 w-4" />
            }
          </div>
          <a routerLink="../" class="text-muted-foreground/60 hover:text-foreground m-0 p-1"> Categories </a>
          @if (isLoading()) {
            <nucleo-icon [icon]="ChevronRight" class="text-muted-foreground h-4 w-4" />
            <hlm-skeleton class="h-5 w-32" />
          } @else if (category()) {
            <nucleo-icon [icon]="ChevronRight" class="text-muted-foreground h-4 w-4" />
            <div class="flex min-w-0 flex-shrink items-center gap-2">
              <span class="block truncate">{{ categoryName() }}</span>
            </div>

            <div class="relative ml-2">
              <button
                type="button"
                hlmBtn
                variant="ghost"
                size="icon"
                hlmDropdownMenuTrigger
                [hlmDropdownMenuTrigger]="categoryMenu"
                aria-haspopup="menu"
                class="h-6 w-6"
              >
                <nucleo-icon [icon]="Ellipsis" [size]="16" />
                <span class="sr-only">Open menu</span>
              </button>

              <ng-template #categoryMenu>
                <hlm-dropdown-menu class="w-68">
                  @if (category()?.isSystemCategory) {
                    <button hlmDropdownMenuItem disabled>
                      <nucleo-icon [icon]="Trash2" [size]="14" />
                      <span class="text-xs">Cannot delete system category</span>
                    </button>
                  } @else {
                    <button hlmDropdownMenuItem (click)="openDeleteDialog()">
                      <nucleo-icon [icon]="Trash2" [size]="14" />
                      <span class="text-xs">Delete...</span>
                    </button>
                  }
                </hlm-dropdown-menu>
              </ng-template>
            </div>

            <div class="ml-2 hidden lg:flex lg:items-center lg:gap-1">
              <ng-container *ngTemplateOutlet="navTabs" />
            </div>
          }
        </nav>
      </div>
    </div>

    @if (category() && !isLoading()) {
      <div class="flex h-10 items-center gap-1 border-t px-3 py-1 lg:hidden">
        <ng-container *ngTemplateOutlet="navTabs" />
      </div>
    }
  </div>

  <div class="h-full flex-1 overflow-y-auto">
    <router-outlet></router-outlet>
  </div>
</div>
