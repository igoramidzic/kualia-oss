<div class="flex h-screen flex-col overflow-hidden select-none">
  <app-user-navbar />

  <main class="flex-1 overflow-auto py-8">
    <div class="flex min-h-full items-center justify-center p-4">
      <div class="w-full max-w-md">
        <div class="mb-6 flex flex-col items-center">
          <h2 class="mb-4 text-center text-2xl">Welcome to Kualia</h2>
          <p class="text-muted-foreground text-center font-light">Get started by completing your onboarding.</p>
        </div>

        <div class="mt-6 flex justify-center">
          <button hlmBtn size="lg" class="w-full max-w-80" (click)="continue()" [disabled]="loading()">
            @if (loading()) {
              Continue...
            } @else {
              Continue
            }
          </button>
        </div>
      </div>
    </div>
  </main>
</div>
